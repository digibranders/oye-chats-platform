<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/oye_favicon_cropped.png?v=8" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#010B23" />
  <meta name="color-scheme" content="dark light" />
  <meta name="application-name" content="OyeChats" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="OyeChats" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>OyeChats Admin</title>
  <script>
    // Apply the persisted theme before first paint to avoid a light/dark flash.
    // Mirrors ThemeContext: default is 'light' when nothing is stored; only an
    // explicit 'dark' or 'system' preference can produce dark.
    (function () {
      try {
        var m = localStorage.getItem('admin_theme_mode');
        var dark = m === 'dark' ||
          (m === 'system' && window.matchMedia &&
           window.matchMedia('(prefers-color-scheme: dark)').matches);
        var el = document.documentElement;
        el.classList.toggle('dark', dark);
        el.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) { /* localStorage unavailable — ignore */ }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
