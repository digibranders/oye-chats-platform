<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=12" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=12" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png?v=12" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <!-- Fonts are fetched here, not from the stylesheet. An `@import url(...)`
       inside CSS cannot start downloading until the stylesheet itself has been
       parsed, which serialises two round trips before any text can render;
       preconnecting and linking in the head starts both in parallel with it. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
  />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#010B23" />
  <meta name="color-scheme" content="light" />
  <meta name="application-name" content="OyeChats" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="OyeChats" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>OyeChats Admin</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
