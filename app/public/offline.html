<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#010B23" />
    <title>OyeChats — offline</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: #010B23;
        color: #E7ECF7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px 24px;
        text-align: center;
      }
      img {
        width: 96px;
        height: 96px;
        margin-bottom: 32px;
        opacity: 0.9;
      }
      h1 {
        font-size: 24px;
        font-weight: 600;
        margin: 0 0 12px;
        letter-spacing: -0.01em;
      }
      p {
        font-size: 15px;
        line-height: 1.5;
        color: #9AA6C0;
        margin: 0 0 32px;
        max-width: 360px;
      }
      button {
        font: inherit;
        font-weight: 600;
        color: #010B23;
        background: #E7ECF7;
        border: 0;
        border-radius: 999px;
        padding: 12px 24px;
        cursor: pointer;
        transition: transform 120ms ease, background 120ms ease;
      }
      button:hover { background: #FFFFFF; }
      button:active { transform: scale(0.97); }
      .status {
        margin-top: 20px;
        font-size: 13px;
        color: #6D7A98;
      }
      .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #FF6B6B;
        margin-right: 8px;
        vertical-align: middle;
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="OyeChats" />
      <h1>You're offline</h1>
      <p>OyeChats can't reach the network right now. Live chats are paused until you're back online.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
      <div class="status"><span class="dot"></span>Waiting for connection…</div>
    </main>
    <script>
      window.addEventListener('online', () => {
        window.location.replace('/');
      });
    </script>
  </body>
</html>
