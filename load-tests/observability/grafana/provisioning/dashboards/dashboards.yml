# ---------------------------------------------------------------------------
# Grafana dashboard provider — auto-loads JSON dashboards from disk.
# Loaded automatically at Grafana startup from
#   /etc/grafana/provisioning/dashboards/
# ---------------------------------------------------------------------------
apiVersion: 1

providers:
  - name: OyeChats Load Test
    orgId: 1
    folder: "OyeChats Load Test"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # This path is mounted from ./grafana/dashboards in docker-compose.yml.
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
