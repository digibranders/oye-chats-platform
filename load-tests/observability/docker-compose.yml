# ---------------------------------------------------------------------------
# OyeChats — OPTIONAL load-test observability stack
# ---------------------------------------------------------------------------
# Prometheus + Grafana + exporters for watching a k6 load test against the
# STAGING backend (FastAPI + PostgreSQL 16 + Redis + ARQ).
#
# IMPORTANT
#   * This stack is entirely optional. It is meant to run on a STAGING box
#     (or your laptop pointed at staging), NEVER against production.
#   * All connection strings / hosts are supplied via a local `.env` file that
#     sits next to this compose file. Nothing is hardcoded here. See the
#     README for the exact variables and an `.env` template.
#   * The exporters below connect OUT to the staging Postgres and staging Redis.
#     Double-check DATA_SOURCE_NAME and REDIS_ADDR point at staging — a
#     production DSN here would scrape production. Do not do that.
#   * Grafana ships with a default admin password. Treat GF_SECURITY_ADMIN_PASSWORD
#     as a CHANGE-ME value and override it in `.env` before exposing the port.
#
# Bring up:   docker compose up -d
# Tear down:  docker compose down
# ---------------------------------------------------------------------------

services:
  # -------------------------------------------------------------------------
  # Prometheus — scrapes the exporters + receives k6 remote-write metrics.
  # -------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: oyechats-loadtest-prometheus
    restart: unless-stopped
    # --web.enable-remote-write-receiver lets `k6 run --out experimental-prometheus-rw`
    # push metrics straight into this Prometheus at /api/v1/write.
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-remote-write-receiver"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    depends_on:
      - node_exporter
      - postgres_exporter
      - redis_exporter

  # -------------------------------------------------------------------------
  # Grafana — dashboards. Exposed on 3001 to avoid clashing with app ports.
  # -------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.1.4
    container_name: oyechats-loadtest-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      # CHANGE-ME: override these in `.env`. The default admin/admin-style
      # credentials must never be used on a shared or internet-facing box.
      GF_SECURITY_ADMIN_USER: "${GF_SECURITY_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:-change-me}"
      # Disable anonymous access and sign-up by default.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      # Datasource + dashboard provider config (auto-provisioned on boot).
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # The dashboard JSON files the provider loads.
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # -------------------------------------------------------------------------
  # postgres_exporter — scrapes the STAGING PostgreSQL 16.
  #   Set DATA_SOURCE_NAME in `.env`, e.g.:
  #     postgresql://readonly_user:PASS@staging-db-host:5432/oyechats?sslmode=disable
  #   Use a read-only role. Never point this at production.
  # -------------------------------------------------------------------------
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: oyechats-loadtest-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "${DATA_SOURCE_NAME:?set DATA_SOURCE_NAME in .env to the STAGING Postgres DSN}"
      # PG_EXPORTER_EXTEND_QUERY_PATH could point at custom queries if needed.
    ports:
      # Exposed for debugging; Prometheus scrapes it over the compose network.
      - "9187:9187"

  # -------------------------------------------------------------------------
  # redis_exporter — scrapes the STAGING Redis (ARQ broker + app cache).
  #   Set REDIS_ADDR in `.env`, e.g. redis://staging-redis-host:6379
  #   Set REDIS_PASSWORD if the staging Redis is authenticated.
  # -------------------------------------------------------------------------
  redis_exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: oyechats-loadtest-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "${REDIS_ADDR:?set REDIS_ADDR in .env to the STAGING Redis address}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      # Track the ARQ queue list length so we can graph queue depth.
      # -check-keys reports redis_key_size / redis_key_value for these keys.
      REDIS_EXPORTER_CHECK_KEYS: "arq:queue:oyechats"
    ports:
      - "9121:9121"

  # -------------------------------------------------------------------------
  # node_exporter — host CPU / memory / load / swap for the STAGING box.
  #   NOTE: for accurate host metrics this must run ON the staging host with
  #   host namespaces mounted (below). If you run the stack on a separate box,
  #   these numbers describe THAT box, not the API box — see README.
  # -------------------------------------------------------------------------
  node_exporter:
    image: prom/node-exporter:v1.8.2
    container_name: oyechats-loadtest-node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    pid: "host"
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"

volumes:
  prometheus_data:
  grafana_data:
