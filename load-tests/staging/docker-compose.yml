# Reproducible STAGING stack for scalability testing (Phase 2).
#
# A full, isolated mirror of the production topology — nginx -> API (gunicorn) ->
# PostgreSQL 16 + pgvector + Redis + ARQ worker — that is safe to load-test and
# throw away. It is SPEND-SAFE by default: a bundled mock LLM/embeddings service
# stands in for OpenAI/Gemini, so no external provider is ever called (matches
# load-tests/mock-llm/server.py, used for the measured knee test).
#
#   docker compose -f load-tests/staging/docker-compose.yml up -d --build
#   docker compose -f load-tests/staging/docker-compose.yml down -v
#
# Health:  curl -fsS http://localhost:8088/health/full
# Point k6 at it:  BASE_URL=http://localhost:8088  (see README.md)
#
# This does NOT touch the dev docker-compose.yml at the repo root, the systemd
# units, or the prod nginx config — it is a self-contained staging definition.
name: oyechats-staging

x-api-env: &api-env
  APP_ENV: development
  DB_URL: postgresql://oyechats:oyechats@db:5432/oyechats
  REDIS_URL: redis://redis:6379/0
  # Route ALL LLM + embedding traffic at the bundled mock — zero external spend.
  LLM_MODEL: openai/gpt-4o-mini
  FALLBACK_MODEL: openai/gpt-4o-mini
  OPENAI_API_KEY: sk-mock-staging
  OPENAI_API_BASE: http://mock-llm:9099/v1
  OPENAI_BASE_URL: http://mock-llm:9099/v1
  GOOGLE_API_KEY: mock-staging
  GEMINI_EMBED_URL: http://mock-llm:9099/v1beta
  RELEVANCE_GATE_ENABLED: "false"
  RERANK_ENABLED: "false"
  # Scalability knobs under test (mirror prod defaults; override to A/B them).
  WEB_CONCURRENCY: "1"
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "10"
  CHAT_MAX_CONCURRENCY: "10"
  CHAT_ACQUIRE_TIMEOUT_S: "8"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: oyechats
      POSTGRES_PASSWORD: oyechats
      POSTGRES_DB: oyechats
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oyechats"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Exposed on a non-default host port so it can't clash with a local Postgres.
    ports:
      - "55432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "56379:6379"

  # Bundled OpenAI+Gemini-compatible mock so the stack never calls a paid provider.
  mock-llm:
    build:
      context: ../../api
    working_dir: /mock
    command: ["uv", "run", "uvicorn", "server:app", "--host", "0.0.0.0", "--port", "9099"]
    environment:
      MOCK_LLM_LATENCY_MS: "1200"
      MOCK_LLM_TTFT_MS: "300"
    volumes:
      - ../mock-llm:/mock:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:9099/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: run migrations (incl. the new hot-path indexes) before API/worker.
  migrate:
    build:
      context: ../../api
    environment: *api-env
    command: ["uv", "run", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ../../api
    environment: *api-env
    # Bind to 0.0.0.0 inside the container (nginx/loopback assumption is prod-only).
    command: ["uv", "run", "gunicorn", "app.main:app", "-c", "gunicorn.conf.py", "-b", "0.0.0.0:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mock-llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: ../../api
    environment:
      <<: *api-env
      # Worker gets its own smaller pool (mirrors the systemd unit / audit F30).
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "5"
      WORKER_MAX_JOBS: "5"
    command: ["uv", "run", "python", "-m", "arq", "app.worker.settings.WorkerSettings"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx-staging.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    ports:
      # The one entrypoint you point load tests + browsers at.
      - "8088:80"

volumes:
  pgdata:
