# Staging reverse proxy — mirrors the PRODUCTION nginx behaviour that matters for
# load testing (SSE never buffered, long read timeout, WebSocket upgrade), minus
# TLS/Cloudflare/real-IP (those are prod-only and irrelevant to an isolated stack).
# Compare with api/nginx/oyechats-api.conf — the streaming/ws directives match.
upstream oyechats_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 60M;

    location / {
        proxy_pass http://oyechats_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (live chat /ws/*)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # SSE / streaming chat: never buffer, allow long-lived reads.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
