# Load balancer for the scale stack: round-robins across the scaled `api`
# replicas using Docker's embedded DNS (127.0.0.11). Using a variable + resolver
# (rather than a static upstream) forces nginx to re-resolve `api`, so it picks up
# ALL replica IPs and rotates them — this is what makes `--scale api=N` actually
# distribute load instead of pinning to one container.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;
    server_name _;
    client_max_body_size 60M;

    location / {
        set $upstream http://api:8000;
        proxy_pass $upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / streaming chat: never buffer, long reads.
        proxy_buffering off;
        proxy_read_timeout 300s;

        # WebSocket upgrade — NOTE: live-chat correctness across replicas is NOT
        # guaranteed (in-memory ConnectionManager). Present for parity only.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
