[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "oyechats-api"
version = "0.1.0"
description = "OyeChats RAG chatbot platform API"
requires-python = ">=3.11,<3.12"

dependencies = [
    "fastapi>=0.116.0,<1.0.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.3.0,<0.4.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "litellm==1.89.4",
    "langchain-text-splitters>=0.2.0",
    "langchain-core>=0.2.0",
    "openai>=1.0.0",
    "langfuse>=4.0.0,<5.0.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "boto3>=1.34.0",
    "pypdf>=6.13.3",
    # Invoice PDF rendering (invoicing v2 Phase 4). Needs system pango:
    # macOS `brew install pango` (+ DYLD_FALLBACK_LIBRARY_PATH=/opt/homebrew/lib),
    # Ubuntu `apt install libpango-1.0-0 libpangoft2-1.0-0`.
    "weasyprint>=63",
    "python-docx>=1.0.0",
    "Pillow>=10.0.0",
    "bcrypt>=4.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
    "defusedxml>=0.7.1",
    "html2text>=2025.4.15",
    "beautifulsoup4>=4.14.3",
    "slowapi>=0.1.9",
    "redis[hiredis]>=5.0.0,<6.0.0",
    "gunicorn>=22.0.0",
    "arq>=0.26.0",
    "flashrank>=0.2.9",
    "trafilatura>=2.0.0",
    "razorpay>=1.4.2",
    "python-jose[cryptography]>=3.5.0",
    "pywebpush>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=15"

# Pyrefly (type checker) — pin to the project's 3.11 venv so it stops
# scanning /opt/anaconda3/lib/python3.13 for our imports and reporting
# "Cannot find module 'app.*'" errors. Matches ``requires-python`` above.
# Rebuild the .venv with ``uv sync`` if the path ever drifts.
[tool.pyrefly]
project-includes = ["app", "tests"]
project-excludes = [
    # ARQ background-worker task functions. Every "error" here is a false
    # positive from SQLAlchemy 1.x-style ``Column(Type)`` model declarations
    # — Pyrefly sees ``bot.name`` as ``Column[str]`` instead of ``str``,
    # then flags every assignment / function call as a type mismatch. The
    # code runs fine (descriptors resolve to real Python values at runtime).
    # The correct long-term fix is migrating models to SQLAlchemy 2.0's
    # ``Mapped[X] = mapped_column(...)`` pattern, which needs care because
    # 25 models × ~500 columns wants its own change window. Until that
    # migration lands, exclude this file so the IDE isn't shouting "34
    # errors" that a reader would waste time investigating.
    "app/worker/tasks.py",
]
python-version = "3.11.0"
python-interpreter = ".venv/bin/python3.11"
