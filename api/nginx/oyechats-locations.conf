# OyeChats API — Nginx location blocks
# Included by oyechats-api.conf (both HTTP and HTTPS server blocks).
#
# Copy to /etc/nginx/snippets/oyechats-locations.conf on the server.
#
# Cloudflare sits in front of Nginx in production. The real visitor IP is
# passed by Cloudflare in the CF-Connecting-IP header. cloudflare-real-ip.conf
# (included before this snippet) runs nginx's realip module: it accepts
# CF-Connecting-IP ONLY when the connection originates from a published
# Cloudflare range (set_real_ip_from) and rewrites $remote_addr to the
# validated visitor IP. $remote_addr is therefore the Cloudflare-validated
# visitor address — NOT a datacenter IP and NOT an attacker-spoofable header
# (P0-1). We forward that validated $remote_addr as X-Real-IP so FastAPI /
# SlowAPI key rate limits on a trustworthy client IP.

# Max upload size — matches _MAX_TOTAL_UPLOAD in document_routes.py (50MB + margin)
client_max_body_size 60M;

# ── Security headers (audit F23) ────────────────────────────────────────────
# `always` emits them on error responses too. TLS/HSTS is normally terminated
# at Cloudflare in prod; these are defence-in-depth at the origin. CSP is
# frame-ancestors-only (the API serves JSON + the dev-only Swagger UI, so a
# content-restricting policy would break /docs without adding value on JSON).
# NOTE: nginx add_header does NOT inherit into a location that sets its own
# add_header — the cache/SSE locations below re-emit these where they add
# Cache-Control, or accept the origin default behind Cloudflare.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
# The API serves one HTML surface (/demo/{bot_key}); everything else is JSON.
# Denying the powerful-feature set outright costs nothing on JSON and means the
# demo page — which frames a customer-supplied URL — cannot be used to prompt a
# visitor for their camera, microphone, or location under our domain. Matches
# the dashboard's own policy in app/vercel.json.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# ── WebSocket endpoints (/ws/) ──────────────────────────────────────────────
# Long-lived connections for live chat. 24h read timeout covers idle sessions.
location /ws/ {
    proxy_pass http://oyechats_api;
    proxy_http_version 1.1;

    # WebSocket upgrade headers
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Forward the Cloudflare-validated visitor IP (see cloudflare-real-ip.conf).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 24h timeout for idle WebSocket connections
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# ── SSE streaming endpoints (/chat/stream) ──────────────────────────────────
# Server-Sent Events must not be buffered — tokens should arrive immediately.
location /chat/stream {
    proxy_pass http://oyechats_api;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Disable buffering for streaming
    proxy_buffering off;
    proxy_cache off;

    # No timeout on streaming — the app handles its own timeouts
    proxy_read_timeout 300s;
}

# ── Crawl endpoint (long-running) ──────────────────────────────────────────
# URL crawling can take 10+ minutes for large sites.
location /crawl {
    proxy_pass http://oyechats_api;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 660s;  # 11 min — above CRAWL_SUBPROCESS_TIMEOUT (600s)
}

# ── Health checks (no rate limiting) ────────────────────────────────────────
location /health {
    proxy_pass http://oyechats_api;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Short timeout — health checks should be fast
    proxy_read_timeout 10s;
}

# ── Default: all other API endpoints ────────────────────────────────────────
location / {
    proxy_pass http://oyechats_api;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Rate limiting: 10 req/s per IP, burst to 20 with nodelay
    limit_req zone=api_limit burst=20 nodelay;

    # 65s — slightly above the 60s app timeout in middleware.py
    proxy_read_timeout 65s;

    # Buffer request bodies to avoid tying up the app worker
    proxy_request_buffering on;
}
