# OyeChats API — Nginx reverse proxy (PRODUCTION configuration)
#
# This mirrors the live config on the API droplet, at
# /etc/nginx/sites-available/oyechats-api (symlinked into sites-enabled/).
# Keeping it here means the repo reproduces prod instead of prod TLS being an
# undocumented hand-edit. The `ssl_*` lines and the HTTP→HTTPS redirect block
# are managed by Certbot (`certbot --nginx`); it re-adds/renews them, so leave
# the "# managed by Certbot" markers intact when syncing.
#
# Apply on the box (TLS is idempotent once the cert exists):
#   sudo cp oyechats-api.conf /etc/nginx/sites-available/oyechats-api
#   sudo ln -sf /etc/nginx/sites-available/oyechats-api /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d api.oyechats.com     # first-time cert only; no-op after
#   sudo nginx -t && sudo systemctl reload nginx
#
# NOTE (worker affinity): the upstream is a single gunicorn bound to
# 127.0.0.1:8000 running ONE worker on purpose — the live-chat WebSocket
# ConnectionManager holds socket state in-process, so multi-worker would split
# a visitor/operator pair across processes. See api/gunicorn.conf.py. A plain
# proxy_pass (no ip_hash upstream) is therefore correct today; revisit only
# when the WebSocket manager moves to a Redis pub/sub backplane ("Phase 3").

server {
    server_name api.oyechats.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (required for /ws/chat/ and /ws/agent)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # SSE / streaming chat: never buffer, allow long-lived reads
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    client_max_body_size 50M;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.oyechats.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.oyechats.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = api.oyechats.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name api.oyechats.com;
    listen 80;
    return 404; # managed by Certbot
}
