name: Deploy Backend

on:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/deploy-api.yml']
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN — deploy only checks out the repo; the SSH
# deploy uses its own secrets, not the workflow token (audit F48).
permissions:
  contents: read

jobs:
  # In-repo CI gate (audit F20): a push to main — even one that bypassed
  # branch-protection checks — cannot reach the droplet unless the full CI
  # suite passes in THIS run.
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy to DigitalOcean via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          DB_URL: ${{ secrets.DB_URL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          R2_KEY_ID: ${{ secrets.R2_KEY_ID }}
          R2_APPLICATION_KEY: ${{ secrets.R2_APPLICATION_KEY }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          SENTRY_DSN_BACKEND: ${{ secrets.SENTRY_DSN_BACKEND }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ vars.LANGFUSE_PUBLIC_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          # Email transport: "brevo" (HTTP API) or "ses" (AWS SES over SMTP).
          # Both providers' credentials can be present at once; EMAIL_PROVIDER
          # decides which one email_service._send_raw_email actually uses.
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER }}
          SES_AWS_REGION: ${{ vars.SES_AWS_REGION }}
          SES_AWS_ACCESS_KEY_ID: ${{ secrets.SES_AWS_ACCESS_KEY_ID }}
          SES_AWS_SECRET_ACCESS_KEY: ${{ secrets.SES_AWS_SECRET_ACCESS_KEY }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          # Pass the deployed git SHA so Sentry tags every event with a
          # release; spikes can then be pinned to a specific commit.
          SENTRY_RELEASE: ${{ github.sha }}
          # Toggle-able feature flags (set as GitHub Actions *variables* to flip without a code push)
          RELEVANCE_GATE_ENABLED: ${{ vars.RELEVANCE_GATE_ENABLED }}
          CHUNK_ENRICHMENT_ENABLED: ${{ vars.CHUNK_ENRICHMENT_ENABLED }}
          RERANK_ENABLED: ${{ vars.RERANK_ENABLED }}
          # Embeddings — Google Gemini (off-box) is the sole provider, reusing
          # GOOGLE_API_KEY. Unset values fall back to safe defaults below.
          EMBED_PROVIDER: ${{ vars.EMBED_PROVIDER }}
          GEMINI_EMBED_MODEL: ${{ vars.GEMINI_EMBED_MODEL }}
          EMBED_DIMENSIONS: ${{ vars.EMBED_DIMENSIONS }}
          EMBED_CONCURRENCY: ${{ vars.EMBED_CONCURRENCY }}
          # Crawl — Spider.cloud managed API (sole primary crawler, off-box).
          # SPIDER_API_KEY is the prepaid Spider.cloud key. On a Spider outage
          # the crawl falls back to Jina Reader (PAYG markdown); JINA_API_KEY is
          # optional (keyless works at lower RPM).
          SPIDER_API_KEY: ${{ secrets.SPIDER_API_KEY }}
          SPIDER_REQUEST_MODE: ${{ vars.SPIDER_REQUEST_MODE }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          JINA_FALLBACK_ENABLED: ${{ vars.JINA_FALLBACK_ENABLED }}
          # Derive the AI Agent's avatar from the favicon found while crawling
          # the customer's site. Ships OFF; the repository variable does not
          # exist yet, and an unset variable stays off via the default below.
          CRAWL_FAVICON_AVATAR_ENABLED: ${{ vars.CRAWL_FAVICON_AVATAR_ENABLED }}
          # TLS verification on the SSRF-guarded fetches. Ships ON; set the
          # variable to false only as a stopgap for a customer whose
          # certificate is broken, while it is being fixed.
          SSRF_TLS_VERIFY_ENABLED: ${{ vars.SSRF_TLS_VERIFY_ENABLED }}
          # ARQ concurrency. Default 5 (crawling runs off-box on Spider, so this
          # is no longer RAM/Chromium-bound). Real ceiling is embedding CPU on the
          # box + the DB pool (~15 conns for 1 worker). Go beyond ~5-6 only with a
          # bigger DB pool / more vCPUs / bge-small embeddings.
          WORKER_MAX_JOBS: ${{ vars.WORKER_MAX_JOBS }}
          # Billing — Stripe (international) + Razorpay (primary, INR/UPI).
          # Missing values become empty strings on the droplet, which
          # config.py treats as "provider disabled". Webhook secrets are
          # required for inbound callback signature verification.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          RAZORPAY_KEY_ID: ${{ vars.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          RAZORPAY_SEAT_PLAN_ID: ${{ vars.RAZORPAY_SEAT_PLAN_ID }}
          RAZORPAY_TEST_PLAN_ID: ${{ vars.RAZORPAY_TEST_PLAN_ID }}
          # USD (international) rail. This workflow rewrites api/.env in full on
          # every deploy, so a hand-edit on the droplet survives only until the
          # next one — the flag has to live here to stay flipped. Defaults to
          # false in the .env write below, so an unset variable keeps the
          # domestic-only behaviour rather than half-opening a rail that would
          # fail at Razorpay's payment step.
          RAZORPAY_SEAT_PLAN_ID_USD: ${{ vars.RAZORPAY_SEAT_PLAN_ID_USD }}
          INTL_PAYMENTS_ENABLED: ${{ vars.INTL_PAYMENTS_ENABLED }}
          # Repo variable, not a secret: it is a topology switch, not a credential.
          # Set to true only once oyechats-ws.service is installed and nginx routes
          # /ws/ to it -- see docs/live-chat-process-split-rollout.md.
          WS_BACKPLANE_ENABLED: ${{ vars.WS_BACKPLANE_ENABLED }}
          CHECKOUT_TEST_CLIENT_IDS: ${{ vars.CHECKOUT_TEST_CLIENT_IDS }}
          # Frontend URL for Stripe success/cancel and Razorpay return redirects.
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          # Public API root. Used to build the unsubscribe link inside manual
          # follow-up emails, so an unset value ships dead links to real
          # recipients. Defaults in config.py to the production host, but is
          # passed explicitly here so a non-prod deploy can point elsewhere.
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          # Google OAuth (Sign in with Google). All five are required — the
          # frontend probes /auth/google/status on every page load and hides
          # the button when the backend isn't configured. Missing any of
          # these in the secrets set silently breaks production OAuth on
          # the next deploy because this workflow rewrites .env in full.
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ vars.GOOGLE_REDIRECT_URI }}
          OAUTH_SUCCESS_REDIRECT_URL: ${{ vars.OAUTH_SUCCESS_REDIRECT_URL }}
          OAUTH_STATE_SECRET: ${{ secrets.OAUTH_STATE_SECRET }}
          # Signs unsubscribe links embedded in manual follow-up emails. Must
          # be a stable, persistent value — Gunicorn runs multiple worker
          # processes, and without a fixed secret each worker would sign
          # with its own random fallback, so a link generated by the worker
          # that sent the email could fail verification on whichever worker
          # handles the later unsubscribe click. Required, not optional.
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
          # Web Push (VAPID) for in-app / operator push notifications. Both are
          # required for PUSH_ENABLED to flip on; without them push silently
          # disables (PUSH_ENABLED=False). VAPID_SUBJECT is intentionally left to
          # the config default (mailto:SUPPORT_EMAIL).
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          # Reoon Email Validation API key (optional — power-mode email validation degrades gracefully when unset)
          REOON_API_KEY: ${{ secrets.REOON_API_KEY }}
          # ipapi.is IP-intelligence key (optional — always-on company/threat signal degrades gracefully when unset)
          IPAPI_IS_KEY: ${{ secrets.IPAPI_IS_KEY }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: DB_URL,GOOGLE_API_KEY,OPENAI_API_KEY,CORS_ORIGINS,R2_KEY_ID,R2_APPLICATION_KEY,R2_BUCKET_NAME,R2_ENDPOINT,R2_PUBLIC_BASE_URL,SENTRY_DSN_BACKEND,SENTRY_RELEASE,LANGFUSE_SECRET_KEY,LANGFUSE_PUBLIC_KEY,BREVO_API_KEY,EMAIL_PROVIDER,SES_AWS_REGION,SES_AWS_ACCESS_KEY_ID,SES_AWS_SECRET_ACCESS_KEY,REDIS_URL,RELEVANCE_GATE_ENABLED,CHUNK_ENRICHMENT_ENABLED,RERANK_ENABLED,EMBED_PROVIDER,GEMINI_EMBED_MODEL,EMBED_DIMENSIONS,EMBED_CONCURRENCY,SPIDER_API_KEY,SPIDER_REQUEST_MODE,JINA_API_KEY,JINA_FALLBACK_ENABLED,CRAWL_FAVICON_AVATAR_ENABLED,SSRF_TLS_VERIFY_ENABLED,WORKER_MAX_JOBS,STRIPE_SECRET_KEY,STRIPE_PUBLISHABLE_KEY,STRIPE_WEBHOOK_SECRET,RAZORPAY_KEY_ID,RAZORPAY_KEY_SECRET,RAZORPAY_WEBHOOK_SECRET,RAZORPAY_SEAT_PLAN_ID,RAZORPAY_TEST_PLAN_ID,RAZORPAY_SEAT_PLAN_ID_USD,INTL_PAYMENTS_ENABLED,CHECKOUT_TEST_CLIENT_IDS,FRONTEND_URL,API_BASE_URL,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_REDIRECT_URI,OAUTH_SUCCESS_REDIRECT_URL,OAUTH_STATE_SECRET,UNSUBSCRIBE_SECRET,VAPID_PUBLIC_KEY,VAPID_PRIVATE_KEY,REOON_API_KEY,IPAPI_IS_KEY,WS_BACKPLANE_ENABLED
          script: |
            set -e  # Abort on any command failure — don't deploy broken code

            # Preflight: this workflow rewrites api/.env in full, so a secret
            # left unset in GitHub Actions would silently break prod on the next
            # deploy. Fail fast instead of shipping a half-configured app
            # (PR #209 review #6). Features that degrade gracefully (push,
            # Stripe fallback, email, Redis, Sentry, Langfuse, Reoon) only warn.
            MISSING=""
            for v in DB_URL OPENAI_API_KEY GOOGLE_API_KEY CORS_ORIGINS \
                     R2_KEY_ID R2_APPLICATION_KEY R2_BUCKET_NAME R2_ENDPOINT R2_PUBLIC_BASE_URL \
                     RAZORPAY_KEY_ID RAZORPAY_KEY_SECRET RAZORPAY_WEBHOOK_SECRET \
                     FRONTEND_URL GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET \
                     GOOGLE_REDIRECT_URI OAUTH_SUCCESS_REDIRECT_URL OAUTH_STATE_SECRET \
                     UNSUBSCRIBE_SECRET; do
              if [ -z "$(printenv "$v" || true)" ]; then MISSING="$MISSING $v"; fi
            done
            if [ -n "$MISSING" ]; then
              echo "::error::Deploy aborted — required secrets missing:$MISSING"
              exit 1
            fi

            # The key ID and the key secret are a PAIR configured in two
            # different places: the ID is a repository VARIABLE (it is public,
            # it ships to the browser at checkout) and the secret is a
            # repository SECRET. Updating one without the other pairs, say, a
            # test ID with a live secret, and Razorpay then rejects every single
            # call. The missing-secrets check above cannot see it, because both
            # values ARE present; the failure surfaces when a real customer
            # tries to pay.
            #
            # The prefixes cannot be compared, because only the ID carries one.
            # So the pair is checked the only way that actually proves anything:
            # by authenticating with it.
            case "$RAZORPAY_KEY_ID" in
              rzp_live_*) RZP_MODE="live" ;;
              rzp_test_*) RZP_MODE="test" ;;
              *) echo "::error::RAZORPAY_KEY_ID is neither rzp_live_ nor rzp_test_"; exit 1 ;;
            esac
            echo "Razorpay mode: $RZP_MODE"

            RZP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
              -u "$RAZORPAY_KEY_ID:$RAZORPAY_KEY_SECRET" \
              "https://api.razorpay.com/v1/plans?count=1" || echo "000")
            case "$RZP_CODE" in
              200)  echo "Razorpay credentials authenticate ($RZP_MODE)." ;;
              401)  echo "::error::Razorpay rejected the key pair (401). The ID is a repository VARIABLE and the secret is a repository SECRET; updating one without the other leaves them mismatched."
                    exit 1 ;;
              000)  echo "::warning::Could not reach Razorpay to verify the key pair. Deploy continues." ;;
              *)    echo "::warning::Razorpay key check returned HTTP $RZP_CODE. Deploy continues." ;;
            esac

            if [ "$RZP_MODE" = "test" ]; then
              echo "::warning::Deploying with Razorpay TEST keys — no customer can actually be charged."
            fi

            # The ₹1 checkout override must never ride along with live keys.
            # `CHECKOUT_TEST_CLIENT_IDS` names `client.id` integers, and any id
            # in it gets top-ups charged at ₹1, its plan swapped for the test
            # plan, discounts skipped, the international kill switch bypassed,
            # and the resulting ₹1 treated by the webhook as a legitimate paid
            # activation worth a full month of credits.
            #
            # It keys on a surrogate autoincrement PK, and the launch wipe
            # restarted `clients.id` at 1. A leftover value like "3,7" that
            # once meant two test accounts now means whichever real customers
            # land on those ids. The scoping comment in config.py promises real
            # customers are never affected; renumbering is what breaks that
            # promise, so the guard belongs here rather than in the code.
            #
            # Set it in the server's .env for a smoke test instead, where the
            # next deploy expires it automatically.
            if [ "$RZP_MODE" = "live" ] && [ -n "${CHECKOUT_TEST_CLIENT_IDS:-}" ]; then
              echo "::error::CHECKOUT_TEST_CLIENT_IDS is set to '${CHECKOUT_TEST_CLIENT_IDS}' while Razorpay is in LIVE mode. Those ids would be charged ₹1 and granted full plan credits, and client ids were renumbered by the launch wipe, so they may now be real customers. Clear the repository variable and re-run."
              exit 1
            fi
            for v in VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY BREVO_API_KEY REDIS_URL \
                     SENTRY_DSN_BACKEND LANGFUSE_SECRET_KEY LANGFUSE_PUBLIC_KEY \
                     STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET REOON_API_KEY IPAPI_IS_KEY \
                     SES_AWS_ACCESS_KEY_ID SES_AWS_SECRET_ACCESS_KEY; do
              if [ -z "$(printenv "$v" || true)" ]; then
                echo "::warning::optional secret $v not set — related feature disabled"
              fi
            done

            cd /opt/oyechats/platform

            # Snapshot the currently-deployed commit and env BEFORE we mutate
            # the tree/.env, so a failed post-restart health check can restore
            # them automatically (audit F05). .env.rollback is untracked, so the
            # reset --hard below leaves it intact.
            PREV_SHA=$(git rev-parse HEAD)
            echo "🧷 Current release pinned for rollback: $PREV_SHA"
            cp api/.env api/.env.rollback 2>/dev/null || true

            # Pre-restart failure guard. Everything from the checkout below to
            # the restart phase mutates the box while the OLD processes keep
            # running: new code on disk, .env already rewritten, migrations
            # possibly applied. Both units are Restart=always, so a failure in
            # that window would leave code this deploy never verified staged for
            # the next crash, OOM or reboot to promote silently. On a non-zero
            # exit before the restarts, put the on-disk tree back so it matches
            # the processes that are still serving traffic.
            PRE_RESTART_GUARD=armed
            restore_pre_restart_state() {
              GUARD_STATUS=$?
              [ "$PRE_RESTART_GUARD" = "armed" ] || return 0
              [ "$GUARD_STATUS" -ne 0 ] || return 0
              PRE_RESTART_GUARD=fired
              echo "::error::Deploy failed before the restart phase (exit $GUARD_STATUS). Services are still running the previous release $PREV_SHA; restoring the on-disk tree to match them."
              cd /opt/oyechats/platform || return 0
              git reset --hard "$PREV_SHA" || echo "WARN: could not restore the checkout to $PREV_SHA"
              if [ -f api/.env.rollback ]; then
                cp api/.env.rollback api/.env || echo "WARN: could not restore api/.env"
              fi
              # The forward path may already have installed the new tree's unit
              # files. Put the running release's units back; daemon-reload only
              # re-reads definitions, it starts and stops nothing. ws is
              # restored only where it is already installed, for the same reason
              # the forward path guards its copy.
              cp api/systemd/oyechats-api.service api/systemd/oyechats-worker.service /etc/systemd/system/ || echo "WARN: could not restore unit files"
              if systemctl cat oyechats-ws.service >/dev/null 2>&1; then
                cp api/systemd/oyechats-ws.service /etc/systemd/system/ || echo "WARN: could not restore the ws unit file"
              fi
              systemctl daemon-reload || echo "WARN: daemon-reload failed while restoring"
              cd api || return 0
              /root/.local/bin/uv sync || echo "WARN: uv sync failed while restoring the previous release"
              # F06: the restored services still run as `oyechats` and must keep
              # reading .env and the venv.
              if getent group oyechats >/dev/null 2>&1; then
                chgrp oyechats .env || echo "WARN: could not chgrp api/.env"
                chmod 640 .env || echo "WARN: could not chmod api/.env"
                chmod -R u+rwX,go+rX .venv || echo "WARN: could not normalize .venv permissions"
              fi
              # Services are deliberately NOT restarted: they are healthy on the
              # previous release, which is now what sits on disk again. The
              # schema is deliberately left forward-migrated, the same policy the
              # post-health rollback follows (migrations are backward-compatible
              # by policy, REMEDIATION_PLAN.md §8; an automatic downgrade risks
              # data loss and needs a human decision).
              echo "On-disk tree restored to $PREV_SHA. Schema left forward-migrated; services untouched."
            }
            trap restore_pre_restart_state EXIT

            # Make the working tree match origin/main verbatim before
            # pulling. Operators occasionally hotfix files in place
            # (scp + restart) when prod is on fire; without this reset,
            # those local edits make `git pull` abort with "would be
            # overwritten by merge". Resetting is safe because:
            #   - The committed source-of-truth lives on origin/main.
            #   - Any in-place edit that survives a deploy is a bug
            #     waiting to happen — better to lose it loudly here
            #     than ship divergent code silently.
            #   - .env is .gitignored, so it's untouched.
            #   - reset --hard discards tracked-file changes only;
            #     untracked files (.env.bak.*, etc.) are kept.
            git fetch origin main
            git reset --hard origin/main
            # Pull is now a no-op but kept for clarity and as a
            # defence in case future scripts add something between
            # reset and reset.
            git pull origin main

            # VAPID private key: written to its own PEM file rather than
            # inlined into .env. systemd's EnvironmentFile= parser strips
            # backslash-escapes (\n) without inserting a real newline, which
            # silently corrupts an escaped-PEM env var — this broke web push
            # in production on 2026-08-10 (worked when read via python-dotenv
            # locally, broke only under systemd). printf '%b' expands the \n
            # escapes into real newlines when writing the file, so the value
            # systemd hands the process is never touched.
            if [ -n "${VAPID_PRIVATE_KEY}" ]; then
              printf '%b' "${VAPID_PRIVATE_KEY}" > api/vapid_private_key.pem
              chmod 600 api/vapid_private_key.pem
              VAPID_PRIVATE_KEY_FILE_PATH="/opt/oyechats/platform/api/vapid_private_key.pem"
            else
              rm -f api/vapid_private_key.pem
              VAPID_PRIVATE_KEY_FILE_PATH=""
            fi

            # WS_BACKPLANE_ENABLED belongs HERE, not hand-edited on the box.
            # This block rewrites api/.env in full on every deploy, so a manual
            # entry survives exactly until the next one. That failure is silent
            # and badly timed: with the WebSocket process split live, the API
            # runs several workers and the backplane is what carries a frame
            # from the worker that produced it to the process holding the
            # socket. Lose it and a visitor and their operator stop seeing each
            # other -- the precise bug the split exists to prevent -- days after
            # the deploy that caused it, with nothing in the diff to point at.
            # Default false keeps it inert until the rollout sets the variable.
            #
            # Generate .env from secrets + hardcoded prod values
            printf '%s\n' \
              "DB_URL=${DB_URL}" \
              "GOOGLE_API_KEY=${GOOGLE_API_KEY}" \
              "OPENAI_API_KEY=${OPENAI_API_KEY}" \
              "APP_ENV=production" \
              "CORS_ORIGINS=${CORS_ORIGINS}" \
              "R2_KEY_ID=${R2_KEY_ID}" \
              "R2_APPLICATION_KEY=${R2_APPLICATION_KEY}" \
              "R2_BUCKET_NAME=${R2_BUCKET_NAME}" \
              "R2_ENDPOINT=${R2_ENDPOINT}" \
              "R2_PUBLIC_BASE_URL=${R2_PUBLIC_BASE_URL}" \
              "SENTRY_DSN_BACKEND=${SENTRY_DSN_BACKEND}" \
              "SENTRY_RELEASE=${SENTRY_RELEASE}" \
              "LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}" \
              "LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}" \
              "LANGFUSE_HOST=https://cloud.langfuse.com" \
              "OTEL_BSP_SCHEDULE_DELAY=1000" \
              "BREVO_API_KEY=${BREVO_API_KEY}" \
              "EMAIL_PROVIDER=${EMAIL_PROVIDER:-brevo}" \
              "SES_AWS_REGION=${SES_AWS_REGION:-ap-south-1}" \
              "SES_AWS_ACCESS_KEY_ID=${SES_AWS_ACCESS_KEY_ID}" \
              "SES_AWS_SECRET_ACCESS_KEY=${SES_AWS_SECRET_ACCESS_KEY}" \
              "REDIS_URL=${REDIS_URL}" \
              "LLM_MODEL=openai/gpt-5.4-mini" \
              "FALLBACK_MODEL=gemini/gemini-2.5-flash" \
              "RERANK_ENABLED=${RERANK_ENABLED}" \
              "RERANK_TOP_N=5" \
              "CAG_LITE_THRESHOLD=20" \
              "CHUNK_SIZE=1000" \
              "CHUNK_OVERLAP=200" \
              "RELEVANCE_THRESHOLD=0.55" \
              "GATE_MODEL=gemini/gemini-2.5-flash" \
              "ENRICHMENT_MODEL=gemini/gemini-2.5-flash" \
              "RELEVANCE_GATE_ENABLED=${RELEVANCE_GATE_ENABLED:-true}" \
              "CHUNK_ENRICHMENT_ENABLED=${CHUNK_ENRICHMENT_ENABLED}" \
              "EMBED_PROVIDER=${EMBED_PROVIDER:-google}" \
              "GEMINI_EMBED_MODEL=${GEMINI_EMBED_MODEL:-gemini-embedding-001}" \
              "EMBED_DIMENSIONS=${EMBED_DIMENSIONS:-768}" \
              "EMBED_CONCURRENCY=${EMBED_CONCURRENCY:-8}" \
              "SPIDER_API_KEY=${SPIDER_API_KEY}" \
              "SPIDER_API_URL=https://api.spider.cloud" \
              "SPIDER_REQUEST_MODE=${SPIDER_REQUEST_MODE:-smart}" \
              "SPIDER_TIMEOUT=1600" \
              "JINA_API_KEY=${JINA_API_KEY}" \
              "JINA_FALLBACK_ENABLED=${JINA_FALLBACK_ENABLED:-true}" \
              "CRAWL_FAVICON_AVATAR_ENABLED=${CRAWL_FAVICON_AVATAR_ENABLED:-false}" \
              "SSRF_TLS_VERIFY_ENABLED=${SSRF_TLS_VERIFY_ENABLED:-true}" \
              "WORKER_MAX_JOBS=${WORKER_MAX_JOBS:-5}" \
              "WORKER_ENABLED=true" \
              "MODERATION_ENABLED=true" \
              "STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}" \
              "STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}" \
              "STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}" \
              "RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}" \
              "RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}" \
              "RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}" \
              "RAZORPAY_SEAT_PLAN_ID=${RAZORPAY_SEAT_PLAN_ID}" \
              "RAZORPAY_TEST_PLAN_ID=${RAZORPAY_TEST_PLAN_ID}" \
              "RAZORPAY_SEAT_PLAN_ID_USD=${RAZORPAY_SEAT_PLAN_ID_USD}" \
              "INTL_PAYMENTS_ENABLED=${INTL_PAYMENTS_ENABLED:-false}" \
              "CHECKOUT_TEST_CLIENT_IDS=${CHECKOUT_TEST_CLIENT_IDS}" \
              "FRONTEND_URL=${FRONTEND_URL}" \
              "API_BASE_URL=${API_BASE_URL:-https://api.oyechats.com}" \
              "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" \
              "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}" \
              "GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}" \
              "OAUTH_SUCCESS_REDIRECT_URL=${OAUTH_SUCCESS_REDIRECT_URL}" \
              "OAUTH_STATE_SECRET=${OAUTH_STATE_SECRET}" \
              "UNSUBSCRIBE_SECRET=${UNSUBSCRIBE_SECRET}" \
              "VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}" \
              "VAPID_PRIVATE_KEY_FILE=${VAPID_PRIVATE_KEY_FILE_PATH}" \
              "REOON_API_KEY=${REOON_API_KEY}" \
              "IPAPI_IS_KEY=${IPAPI_IS_KEY}" \
              "WS_BACKPLANE_ENABLED=${WS_BACKPLANE_ENABLED:-true}" \
              > api/.env

            # Non-root services (audit F06): after the one-time
            # migrate-to-nonroot.sh migration the API/worker run as the
            # `oyechats` user and must be able to read the freshly (re)written
            # .env. The `>` redirection above truncates in place and preserves
            # owner/mode, but re-assert here so a deleted/recreated .env can
            # never lock the services out. No-op before the migration (the
            # group doesn't exist yet) and it must stay 0640 — .env holds every
            # production secret.
            if getent group oyechats >/dev/null 2>&1; then
              chgrp oyechats api/.env
              chmod 640 api/.env
              if [ -f api/vapid_private_key.pem ]; then
                chgrp oyechats api/vapid_private_key.pem
                chmod 640 api/vapid_private_key.pem
              fi
            fi

            # System libs for WeasyPrint (invoice PDF rendering) — idempotent.
            # Without pango the worker's invoice-PDF sweep logs one clear
            # error per tick and skips; installing here makes it functional.
            apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 || \
              echo "WARN: pango install failed — invoice PDFs will be skipped until installed"

            # Sync dependencies
            cd api
            /root/.local/bin/uv sync

            # Non-root services (audit F06) safety net: uv sync runs as root
            # with umask 022, so the venv is normally already group/world
            # readable — but a wheel can ship restrictive file modes.
            # Normalize so the unprivileged `oyechats` service user can always
            # import the venv. Ownership stays root (the service must not be
            # able to rewrite its own packages). No-op before the migration.
            if getent group oyechats >/dev/null 2>&1; then
              chmod -R u+rwX,go+rX .venv
            fi

            # Assert litellm installed cleanly before touching migrations or
            # restarting services. The 2026-07-01 outage was a partial `uv sync`
            # that left litellm a hollow namespace package (missing __init__.py):
            # `import litellm` succeeded but `litellm.completion` was gone, so
            # every chat 500'd in prod while /health stayed green. `set -e` is
            # active here, so a failed assertion aborts the deploy before the new
            # (broken) tree is ever restarted onto.
            echo "🔎 Verifying litellm imported with its completion API..."
            /root/.local/bin/uv run python -c "import litellm; assert litellm.completion, 'litellm.completion missing — partial/namespace install; aborting deploy'"

            # WeasyPrint end-to-end probe (import + a real render exercises the
            # pango system libs). Non-fatal: invoicing PDFs degrade to a clean
            # per-sweep skip, and the money path is unaffected — but surface it
            # loudly in the deploy log.
            echo "🔎 Verifying WeasyPrint can render (pango present)..."
            /root/.local/bin/uv run python -c "import weasyprint; weasyprint.HTML(string='<p>probe</p>').write_pdf()" \
              || echo "WARN: WeasyPrint render probe failed — invoice PDF sweep will skip until pango is installed"

            # NOTE: No headless browser or local embedding model runs on this
            # box. Crawling runs on Spider.cloud (Jina Reader fallback), and
            # embeddings run on Google Gemini — both off-box. The playwright/
            # crawl4ai/fastembed packages have been removed from the dependency
            # set, so `uv sync` installs a leaner tree and no Chromium/ONNX RAM
            # is consumed here (this was the original OOM cause).

            # Run migrations
            /root/.local/bin/uv run alembic upgrade head

            # F06 prerequisites: the committed units run as the `oyechats`
            # service user. Create the user + file grants BEFORE installing
            # units — idempotent, so on an already-migrated droplet this is a
            # fast no-op, and on one that never ran the staged migration the
            # units can't strand the services on a missing user. (The full
            # script without --prepare-only additionally runs preflight probes
            # as the service user — the recommended staged path, see
            # DEPLOYMENT.md "Migrating services to non-root".)
            bash /opt/oyechats/platform/api/scripts/migrate-to-nonroot.sh --prepare-only

            # Sync systemd units from the repo (repo is source of truth).
            # This ensures the worker — and any future unit-file edits — are
            # picked up on every deploy instead of drifting from the repo.
            cp /opt/oyechats/platform/api/systemd/oyechats-api.service /etc/systemd/system/
            cp /opt/oyechats/platform/api/systemd/oyechats-worker.service /etc/systemd/system/
            # oyechats-ws.service was missing from this list, so on hosts that
            # run the WebSocket split its unit never picked up a repo edit while
            # api and worker did. It is copied only where the unit already
            # exists, because `systemctl cat` is also the existence test the
            # restart below uses: copying it everywhere would make that test
            # true on hosts that never opted into the split and start a second
            # Gunicorn on 127.0.0.1:8001 that nginx does not route to.
            # Installing the split stays the manual act documented in the unit.
            if systemctl cat oyechats-ws.service >/dev/null 2>&1; then
              cp /opt/oyechats/platform/api/systemd/oyechats-ws.service /etc/systemd/system/
            fi
            cp /opt/oyechats/platform/api/systemd/oyechats-backup.service /etc/systemd/system/
            cp /opt/oyechats/platform/api/systemd/oyechats-backup.timer /etc/systemd/system/
            systemctl daemon-reload
            systemctl enable oyechats-api oyechats-worker
            # Nightly backup runs off the committed timer (audit F19), not a
            # hand-typed root cron. The script path must be executable.
            chmod +x /opt/oyechats/platform/api/scripts/backup.sh
            systemctl enable --now oyechats-backup.timer

            # Restart phase begins. Disarm the pre-restart guard here: from this
            # point the new code is live, so recovery belongs to the post-health
            # rollback below, which restores the tree AND restarts the services.
            # Two owners would fight over the same restore.
            PRE_RESTART_GUARD=disarmed
            trap - EXIT

            # Restart worker FIRST so its heartbeat is fresh before the new
            # API comes up — the deploy gate hits /health/full, which 503s
            # when the worker heartbeat is missing, so a stale worker would
            # fail the deploy. Worker first → API second avoids that race.
            systemctl restart oyechats-worker
            systemctl restart oyechats-api

            # oyechats-ws.service serves every WebSocket (nginx proxies /ws/ to
            # 127.0.0.1:8001). It was never in this list, so it kept running
            # whatever code it started with while api and worker moved on: on
            # 2026-08-25 it was a full deploy behind. That process is where ALL
            # live-chat translation executes, so a translation hotfix could look
            # deployed and silently not be.
            #
            # Restarted LAST and only if the unit is installed, because it drops
            # open sockets: visitors and operators reconnect (the widget has
            # backoff and re-fetches history), but doing it before the API is
            # healthy would reconnect them into a half-deployed backend.
            # `systemctl cat` is the existence test: it fails only when no unit
            # file exists. `is-enabled` was wrong here -- a unit that is
            # installed and running but never `systemctl enable`d reports
            # "disabled" and would be skipped, which is the exact silent-skip
            # this block exists to end. The else branch is deliberate: a skip
            # has to be visible in the deploy log, not inferred from its
            # absence.
            if systemctl cat oyechats-ws.service >/dev/null 2>&1; then
              systemctl restart oyechats-ws
              echo "restarted oyechats-ws"
            else
              echo "oyechats-ws.service not installed on this host; skipping"
            fi

            # Reload Nginx if config exists (Phase 1 scalability: reverse proxy)
            if [ -f /etc/nginx/sites-enabled/oyechats-api.conf ]; then
              nginx -t && systemctl reload nginx
            fi

            # Deploy gate hits /health/full (DB + Redis + worker), not
            # /health (DB + Redis only). /health is for LB probes and must
            # not flap on worker hiccups; /health/full is the strict check
            # that enforces a complete deploy before this job goes green.
            # Server takes ~25s to start (Gunicorn + Sentry + DB init).
            echo "⏳ Waiting 15s for server startup..."
            sleep 15
            set +e  # Temporarily disable errexit for the retry loop
            for i in 1 2 3 4 5 6; do
              if curl -sf http://localhost:8000/health/full > /dev/null 2>&1; then
                echo "✅ Deploy successful (attempt $i)"
                exit 0
              fi
              echo "⏳ Health check attempt $i failed, retrying in 5s..."
              sleep 5
            done
            echo "❌ Deploy failed — server not responding after 45s"
            # Capture diagnostics from the BROKEN release before we roll back.
            systemctl status oyechats-api oyechats-worker --no-pager || true
            journalctl -u oyechats-api --since '1 minute ago' --no-pager -n 30 || true
            journalctl -u oyechats-worker --since '1 minute ago' --no-pager -n 20 || true

            # ── Automatic rollback to the previous healthy release (audit F05) ──
            # Restore the previous commit + env and restart. Schema is left
            # forward-migrated: our migrations are backward-compatible by policy
            # (see REMEDIATION_PLAN.md §8), so the previous code runs against the
            # newer schema. We deliberately do NOT auto-downgrade migrations —
            # that risks data loss and needs a human decision.
            echo "↩️  Rolling back to previous release $PREV_SHA ..."
            cd /opt/oyechats/platform
            git reset --hard "$PREV_SHA"
            if [ -f api/.env.rollback ]; then cp api/.env.rollback api/.env; fi
            # Restore the PREVIOUS release's unit files too — the forward path
            # installed the new tree's units, and a release whose units are
            # what broke it (e.g. a bad hardening directive) can only recover
            # if rollback reverts them alongside the code.
            cp api/systemd/oyechats-api.service api/systemd/oyechats-worker.service /etc/systemd/system/
            # ws too, on hosts that run the split: the forward path installs its
            # unit there, so a rollback that skipped it would leave the WebSocket
            # process on the rolled-back-FROM unit file. Guarded by the same
            # existence test, so a host without the split stays without it.
            if systemctl cat oyechats-ws.service >/dev/null 2>&1; then
              cp api/systemd/oyechats-ws.service /etc/systemd/system/
            fi
            systemctl daemon-reload
            cd api
            /root/.local/bin/uv sync || echo "WARN: uv sync failed during rollback"
            # F06: same .env group-read + venv-readability re-assertions as the
            # forward path — the restored services still run as `oyechats`.
            if getent group oyechats >/dev/null 2>&1; then
              chgrp oyechats .env && chmod 640 .env
              chmod -R u+rwX,go+rX .venv
            fi
            systemctl restart oyechats-worker
            systemctl restart oyechats-api
            # Same reasoning as the forward path: a rollback that leaves the
            # WebSocket process on the rolled-back-FROM code is not a rollback.
            # `systemctl cat` is the existence test: it fails only when no unit
            # file exists. `is-enabled` was wrong here -- a unit that is
            # installed and running but never `systemctl enable`d reports
            # "disabled" and would be skipped, which is the exact silent-skip
            # this block exists to end. The else branch is deliberate: a skip
            # has to be visible in the deploy log, not inferred from its
            # absence.
            if systemctl cat oyechats-ws.service >/dev/null 2>&1; then
              systemctl restart oyechats-ws
              echo "restarted oyechats-ws"
            else
              echo "oyechats-ws.service not installed on this host; skipping"
            fi
            sleep 15
            for i in 1 2 3 4 5 6; do
              if curl -sf http://localhost:8000/health/full > /dev/null 2>&1; then
                echo "✅ Rolled back to $PREV_SHA and healthy (attempt $i). Deploy still marked FAILED."
                exit 1
              fi
              echo "⏳ Rollback health check attempt $i failed, retrying in 5s..."
              sleep 5
            done
            echo "🔥 ROLLBACK ALSO UNHEALTHY — manual intervention required (previous release: $PREV_SHA)"
            systemctl status oyechats-api oyechats-worker --no-pager || true
            exit 1
