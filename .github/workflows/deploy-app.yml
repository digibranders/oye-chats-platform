name: Deploy Admin Dashboard

# The admin SPA ships AFTER the backend it talks to, never beside it.
#
# Vercel used to deploy this project itself, on its Git integration, the moment
# main moved. That put the dashboard and the API in a race the dashboard
# usually won: Vercel builds a Vite SPA in a couple of minutes, while
# `deploy-api.yml` runs the full CI suite, migrates the database over SSH and
# then waits for `/health/full` to come back green. A release that added an
# endpoint therefore put a dashboard live against a backend that did not have
# it yet, and every user in that window got 404s from a screen that looked fine.
#
# So the Git integration is off for this project (`app/vercel.json`,
# `git.deploymentEnabled.main`) and the deployment is triggered from here
# instead, by a Deploy Hook, once the backend for THIS commit is confirmed
# healthy. `git.deploymentEnabled` only suppresses deployments made "upon
# commits" - Deploy Hooks still fire, which is what makes the swap possible.
# (The one setting that WOULD break the hook is the deprecated
# `github.enabled: false`. Do not add it.)
#
# SETUP, one time: create a Deploy Hook on the `main` branch under the Vercel
# project's Settings -> Git, and store the URL as the repository secret
# `VERCEL_DEPLOY_HOOK_URL`. The URL is a credential - anyone holding it can
# deploy the project.

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/deploy-app.yml']
  workflow_dispatch:

# `actions: read` is what lets the wait job see the backend workflow's run.
# Nothing here writes to the repository.
permissions:
  contents: read
  actions: read

# Two pushes in quick succession must not deploy out of order. Queued rather
# than cancelled: a superseded run still has to release its slot cleanly, and
# the hook itself already collapses duplicate builds of the same commit.
concurrency:
  group: deploy-app
  cancel-in-progress: false

jobs:
  # In-repo CI gate (audit F20), same as the API and widget deploys: a push to
  # main that bypassed branch protection still cannot reach production unless
  # the full suite passes in THIS run.
  ci:
    uses: ./.github/workflows/ci.yml

  # Runs beside `ci` rather than after it, so the wait overlaps the suite
  # instead of following it. `deploy` needs both.
  wait-for-backend:
    name: Wait for the backend deploy
    runs-on: ubuntu-latest
    # The backend's own deploy is ~15 minutes on a bad day: CI, then migrations,
    # then the health gate and its retries.
    timeout-minutes: 50
    steps:
      - name: Wait for the backend deploy of this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          WORKFLOW='deploy-api.yml'
          # A run triggered by the same push as this one is created within
          # seconds. One that has not appeared by now is one that is never
          # coming: the commit did not touch `api/**`, so there is no backend
          # deploy to wait for and the dashboard may ship on its own.
          GRACE_SECONDS=120
          # Also the window in which a FAILED backend deploy may be re-run and
          # still carry the dashboard with it. See the failure branch below.
          DEADLINE_SECONDS=2400
          started=$SECONDS
          reported_failure=''

          while :; do
            # A transient API failure must not fail the deploy, so a failed
            # read is treated as "nothing yet" and retried.
            run=$(gh api \
              "repos/${REPO}/actions/workflows/${WORKFLOW}/runs?head_sha=${SHA}&per_page=100" \
              --jq '.workflow_runs | sort_by(.created_at) | last // empty' 2>/dev/null || echo '')

            if [ -n "$run" ]; then
              status=$(jq -r '.status' <<<"$run")
              conclusion=$(jq -r '.conclusion // ""' <<<"$run")
              url=$(jq -r '.html_url' <<<"$run")

              if [ "$status" = 'completed' ]; then
                case "$conclusion" in
                  success|skipped)
                    echo "Backend deploy ${conclusion}. Dashboard may ship: ${url}"
                    exit 0
                    ;;
                  *)
                    # `deploy-api.yml` rolls the droplet back to the previous
                    # healthy release when it fails, so what is live right now
                    # is the OLD backend. Shipping a new dashboard against it
                    # is the exact breakage this workflow exists to prevent.
                    #
                    # But this is NOT the end of the story, and treating it as
                    # one stranded the dashboard for eleven hours on 2026-09-01:
                    # the backend deploy failed at 17:58, this gate read that
                    # conclusion eleven seconds later and exited, the backend was
                    # re-run and went green at 18:16, and nothing re-triggered
                    # the dashboard. `deploy-app.yml` fires on `push`, and a
                    # re-run is not a push, so the console silently sat on the
                    # previous build until the next merge. Referral attribution
                    # shipped its backend half and not its frontend half.
                    #
                    # So a failure is reported once and then WAITED OUT. A
                    # re-run reuses the same run id with a fresh attempt, so the
                    # poll below sees it go back to `in_progress` and then to
                    # `success` on its own. If no re-run comes, the deadline
                    # below still fails the job.
                    if [ "$reported_failure" != "$conclusion" ]; then
                      echo "::warning::Backend deploy concluded '${conclusion}'; the droplet has rolled back, so the dashboard is held. Re-run it within the deadline and this job will pick the re-run up and ship. ${url}"
                      reported_failure="$conclusion"
                    fi
                    ;;
                esac
              else
                # Only while it is genuinely still running. A completed-but-
                # failed run is waiting on a human to re-run it, and the warning
                # above already said so once; repeating it every 15s for the
                # rest of the deadline buries it.
                echo "Backend deploy is ${status}; waiting. ${url}"
              fi
            elif [ $((SECONDS - started)) -ge $GRACE_SECONDS ]; then
              echo "No backend deploy for ${SHA} after ${GRACE_SECONDS}s: this commit does not touch api/**. Proceeding."
              exit 0
            else
              echo "No backend deploy yet; inside the ${GRACE_SECONDS}s grace period."
            fi

            if [ $((SECONDS - started)) -ge $DEADLINE_SECONDS ]; then
              if [ -n "$reported_failure" ]; then
                echo "::error::Backend deploy concluded '${reported_failure}' and was not re-run successfully within ${DEADLINE_SECONDS}s. The droplet is on the previous release, so the dashboard must not ship against it. Re-run the backend deploy, then re-run this workflow."
              else
                echo "::error::Timed out after ${DEADLINE_SECONDS}s waiting for the backend deploy to finish."
              fi
              exit 1
            fi
            sleep 15
          done

  deploy:
    needs: [ci, wait-for-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Vercel deployment
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail

          if [ -z "${HOOK_URL:-}" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_URL is not set. Create a Deploy Hook for the main branch under the Vercel project's Settings -> Git and add the URL as a repository secret. Without it nothing deploys the dashboard, because the Git integration is off."
            exit 1
          fi

          # `--fail-with-body` so a 4xx/5xx is an error AND its body is still
          # printed; the URL itself is never echoed.
          curl --silent --show-error --fail-with-body \
            --retry 3 --retry-connrefused --max-time 30 \
            -X POST "$HOOK_URL"
          echo
          echo "Deploy Hook accepted. Vercel is building ${GITHUB_SHA}."
