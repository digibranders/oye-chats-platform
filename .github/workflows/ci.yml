name: CI Checks

on:
  push:
    branches: [development]
  # Gate PRs into BOTH long-lived branches. ``development`` is included so a
  # feature PR (e.g. billing regression fixes) runs the full backend suite
  # before merge, not only on the post-merge push to ``development``.
  pull_request:
    branches: [main, development]
  # Reusable entry point: the deploy workflows call this so production deploys
  # carry an in-repo dependency on CI passing (audit F20) — merges to main
  # cannot reach the droplet/CDN without these jobs going green first.
  workflow_call:

# Least-privilege GITHUB_TOKEN — these jobs only read the repo (audit F48).
permissions:
  contents: read

jobs:
  # ── Backend (Python) ──
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'  # Match production server

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Lint with ruff
        working-directory: api
        run: |
          ~/.local/bin/uv sync
          ~/.local/bin/uv run ruff check .
          ~/.local/bin/uv run ruff format --check .

      - name: Run tests
        working-directory: api
        env:
          DB_URL: postgresql://test:test@localhost:5432/test
          GOOGLE_API_KEY: test-key
          APP_ENV: testing
        run: |
          ~/.local/bin/uv run pytest -x -q --cov=app --cov-report=term-missing

  # ── Widget (React) ──
  widget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install
        working-directory: widget
        run: npm ci

      - name: Lint
        working-directory: widget
        run: npm run lint

      - name: Build
        working-directory: widget
        run: npm run build
        env:
          VITE_API_URL: https://api.oyechats.com
          VITE_WIDGET_BASE: https://cdn.oyechats.com/

      - name: Bundle size check
        working-directory: widget
        run: npm run size

      - name: Upload bundle stats artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: widget-bundle-stats
          path: widget/dist/app/stats.html
          retention-days: 14

  # ── Admin Dashboard (React) ──
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Lint
        working-directory: app
        run: |
          npm ci
          npm run lint

      - name: Build
        working-directory: app
        run: npm run build
        env:
          VITE_API_URL: https://api.oyechats.com
