name: CI Checks

on:
  push:
    branches: [development]
  # Gate PRs into BOTH long-lived branches. ``development`` is included so a
  # feature PR (e.g. billing regression fixes) runs the full backend suite
  # before merge, not only on the post-merge push to ``development``.
  pull_request:
    branches: [main, development]
  # Reusable entry point: the deploy workflows call this so production deploys
  # carry an in-repo dependency on CI passing (audit F20) — merges to main
  # cannot reach the droplet/CDN without these jobs going green first.
  workflow_call:

# Least-privilege GITHUB_TOKEN — these jobs only read the repo (audit F48).
permissions:
  contents: read

jobs:
  # ── Backend (Python) ──
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'  # Match production server

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Lint with ruff
        working-directory: api
        run: |
          ~/.local/bin/uv sync
          ~/.local/bin/uv run ruff check .
          ~/.local/bin/uv run ruff format --check .

      # The test suite builds its schema with ``Base.metadata.create_all()``
      # (tests/conftest.py), so it NEVER executes a migration. Nothing else in
      # CI ran alembic either, which is how a migration whose upgrade() did not
      # match its own name reached production once already. This gate runs the
      # real chain against a throwaway database:
      #   upgrade head  → every migration actually executes, in order
      #   check         → the resulting schema matches the models (no drift)
      #   downgrade -1  → the newest migration is reversible
      # A separate database keeps it clear of the create_all schema the tests use.
      - name: Migrations apply, match the models, and reverse
        working-directory: api
        env:
          GOOGLE_API_KEY: test-key
          APP_ENV: testing
        run: |
          PGPASSWORD=test psql -h localhost -U test -d test \
            -c "DROP DATABASE IF EXISTS migrations_check" \
            -c "CREATE DATABASE migrations_check"
          export DB_URL=postgresql://test:test@localhost:5432/migrations_check
          ~/.local/bin/uv run alembic upgrade head
          ~/.local/bin/uv run alembic check
          ~/.local/bin/uv run alembic downgrade -1
          ~/.local/bin/uv run alembic upgrade head

      - name: Run tests
        working-directory: api
        env:
          DB_URL: postgresql://test:test@localhost:5432/test
          GOOGLE_API_KEY: test-key
          APP_ENV: testing
          # Seat add-on billing is env-configured (no hardcoded default). Every
          # real environment sets this; provide a dummy id so the seat-path
          # tests run instead of tripping the "not configured" guard.
          RAZORPAY_SEAT_PLAN_ID: plan_test_seat
        run: |
          ~/.local/bin/uv run pytest -x -q --cov=app --cov-report=term-missing

  # ── Widget (React) ──
  widget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install
        working-directory: widget
        run: npm ci

      - name: Lint
        working-directory: widget
        run: npm run lint

      # 79 tests that nothing was running. `npm test` existed in package.json
      # and was simply never wired into CI — and had rotted unnoticed while
      # nothing ran it: the script globbed `src/services/**/*.test.js`, which
      # only Node >= 22 expands itself. On this runner's Node 20 it resolved to
      # nothing and exited 1. The script now uses a single-level glob the SHELL
      # expands, which behaves the same on every Node and every shell. Widget
      # tests therefore have to live directly in `src/services/`.
      - name: Test
        working-directory: widget
        run: npm test

      - name: Build
        working-directory: widget
        run: npm run build
        env:
          VITE_API_URL: https://api.oyechats.com
          VITE_WIDGET_BASE: https://cdn.oyechats.com/

      # The Playwright suites were in the repo but never wired into CI, so the
      # widget's WebKit project had never actually run anywhere. Installs both
      # browsers the config declares (chromium + the iPhone 14 WebKit profile)
      # so neither project is silently skipped.
      - name: Install browsers
        working-directory: widget
        run: npm run e2e:install

      # Serves the build produced above, so this is the shipped bundle.
      - name: Browser tests (chromium + WebKit)
        working-directory: widget
        run: npm run e2e

      - name: Bundle size check
        working-directory: widget
        run: npm run size

      - name: Upload bundle stats artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: widget-bundle-stats
          path: widget/dist/app/stats.html
          retention-days: 14

  # ── Admin Dashboard (React) ──
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Lint
        working-directory: app
        run: |
          npm ci
          npm run lint

      # Vite does NOT typecheck — `npm run build` transpiles and strips types,
      # so a type error builds and ships perfectly happily. Nothing in CI ran
      # tsc, which is how three errors sat on `development` unnoticed, one of
      # them an import of a symbol the type shim never declared.
      - name: Typecheck
        working-directory: app
        run: npx tsc --noEmit

      - name: Test
        working-directory: app
        run: npx vitest run

      - name: Build
        working-directory: app
        run: npm run build

      - name: Install browsers
        working-directory: app
        run: npm run e2e:install

      # `npm run e2e` rebuilds against the mock origin first, so this does not
      # disturb the production build above.
      - name: Browser tests
        working-directory: app
        run: npm run e2e
        env:
          VITE_API_URL: https://api.oyechats.com
